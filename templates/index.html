<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Handbook Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <main>
    <header>
      <h1>Handbook Assistant</h1>
      <p class="sub">Ask a question about the Northwind Robotics employee handbook.</p>
    </header>

    <div class="ask-row">
      <input
        type="text"
        id="question"
        placeholder="How much parental leave do employees get?"
        autocomplete="off">
      <button id="submit">Ask</button>
    </div>

    <div id="status"></div>
    <div id="answer"></div>
    <div id="sources"></div>
  </main>

  <script>
    const input   = document.getElementById("question");
    const button  = document.getElementById("submit");
    const status  = document.getElementById("status");
    const answer  = document.getElementById("answer");
    const sources = document.getElementById("sources");

    async function askQuestion() {
      const question = input.value.trim();
      if (!question) return;

      answer.innerHTML = "";
      sources.innerHTML = "";
      status.textContent = "Searching the handbook...";
      button.disabled = true;

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: question })
        });

        const data = await res.json();
        status.textContent = "";

        if (data.error) {
          answer.textContent = "Error: " + data.error;
          return;
        }

        answer.innerHTML = "<h2>Answer</h2><p>" + clean(data.answer) + "</p>";

        let html = "<h2>Sources</h2>";
        data.sources.forEach(s => {
          html += `<div class="source">
                     <span class="page">Page ${s.page}</span>
                     <span class="preview">${escapeHtml(s.preview)}...</span>
                   </div>`;
        });
        sources.innerHTML = html;

      } catch (err) {
        status.textContent = "";
        answer.textContent = "Could not reach the server.";
      } finally {
        button.disabled = false;
      }
    }

    function clean(text) {
      return escapeHtml(text)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\n/g, "<br>");
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    button.addEventListener("click", askQuestion);
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") askQuestion();
    });
  </script>

</body>
</html>
